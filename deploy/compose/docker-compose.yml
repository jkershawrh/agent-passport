services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: passport
      POSTGRES_PASSWORD: passport
      POSTGRES_DB: passport
    ports:
      - "54330:5432"
    volumes:
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passport -d passport"]
      interval: 2s
      timeout: 2s
      retries: 20

  agent-passport:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PASSPORT_DB_URL: postgres://passport:passport@postgres:5432/passport?sslmode=disable
      PASSPORT_GRPC_PORT: "9094"
      PASSPORT_HEALTH_PORT: "8080"
      PASSPORT_METRICS_PORT: "8085"
    ports:
      - "9094:9094"
      - "19080:8080"
      - "19085:8085"
